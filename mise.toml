min_version = '2026.4.6'

[settings]
experimental = true
lockfile = true
locked = false

[deps.npm]
auto = true # Auto-run before mise x/run

[tools]
node = '22.13.1'
pnpm = '10.24.0'
hk = "1.41.0"
pkl = "0.31.1"
gitleaks = "8.30.1"
aube = "1.4.0"

[hooks]
# Automatically install/update hooks when tools are installed, 
# but avoid doing  it in the CI environment
postinstall = "{% if env.CI is not defined %} hk install --mise {% endif %}"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.aube-install]
description = 'Installs dependencies with aube'
run = 'aube ci'
sources = ['package.json', 'aube-lock.yaml', 'mise.toml']
outputs = ['node_modules/.aube-state/lockfile']

[tasks.test]
run = "vitest"
depends = ["aube-install"]
